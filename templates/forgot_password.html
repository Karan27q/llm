{% extends "base.html" %}

{% block title %}Reset Password - AI Chatbot{% endblock %}

{% block content %}
<div class="flex-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 440px;">
    <div class="glass-panel fade-in" style="padding: 40px;">
      <div class="text-center mb-4">
        <h1 style="font-size: 1.8rem; font-weight: 600; margin-bottom: 8px;">Forgot Password</h1>
        <p class="text-muted">Enter your registered email to request a password reset link</p>
      </div>

      <form id="forgotForm">
        <div id="message" class="mb-4"></div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-input" required placeholder="Enter your email address">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="submitBtn">Send Reset Link</button>
      </form>

      <div class="text-center mt-4">
        <p class="text-secondary text-sm">
          Remember your password? <a href="/login" style="color: var(--accent-color); font-weight: 500;">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const messageDiv = document.getElementById('message');
    const btn = document.getElementById('submitBtn');

    btn.disabled = true;
    btn.innerText = 'Sending...';
    messageDiv.innerHTML = '';

    try {
      const res = await fetch('/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (res.ok) {
        messageDiv.innerHTML = 'If this email is registered, a reset link has been generated and logged.';
        messageDiv.style.color = 'var(--success-color)';
      } else {
        messageDiv.innerHTML = data.message || 'Error occurred.';
        messageDiv.style.color = 'var(--danger-color)';
        btn.disabled = false;
        btn.innerText = 'Send Reset Link';
      }
    } catch (error) {
      messageDiv.innerHTML = 'Connection error. Please try again.';
      messageDiv.style.color = 'var(--danger-color)';
      btn.disabled = false;
      btn.innerText = 'Send Reset Link';
    }
  });
</script>
{% endblock %}
