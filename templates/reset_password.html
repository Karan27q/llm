{% extends "base.html" %}

{% block title %}Confirm Password Reset - AI Chatbot{% endblock %}

{% block content %}
<div class="flex-center" style="min-height: 100vh;">
  <div class="container" style="max-width: 440px;">
    <div class="glass-panel fade-in" style="padding: 40px;">
      <div class="text-center mb-4">
        <h1 style="font-size: 1.8rem; font-weight: 600; margin-bottom: 8px;">Reset Password</h1>
        <p class="text-muted">Enter and confirm your new strong password</p>
      </div>

      <form id="resetForm">
        <div id="message" class="mb-4"></div>

        <div class="input-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="form-input" required placeholder="Min 8 chars, A-Z, a-z, 1-9, symbol">
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" required placeholder="Re-enter your password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;" id="resetBtn">Change Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Extract token from URL path
  const token = window.location.pathname.split('/').pop();

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const messageDiv = document.getElementById('message');
    const btn = document.getElementById('resetBtn');

    if (password !== confirmPassword) {
      messageDiv.innerHTML = 'Passwords do not match.';
      messageDiv.style.color = 'var(--danger-color)';
      return;
    }

    btn.disabled = true;
    btn.innerText = 'Updating...';
    messageDiv.innerHTML = '';

    try {
      const res = await fetch(`/reset-password/${token}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });
      const data = await res.json();

      if (res.ok) {
        messageDiv.innerHTML = 'Password updated successfully! Redirecting to login...';
        messageDiv.style.color = 'var(--success-color)';
        setTimeout(() => window.location.href = '/login', 1500);
      } else {
        messageDiv.innerHTML = data.message || 'Reset failed.';
        messageDiv.style.color = 'var(--danger-color)';
        btn.disabled = false;
        btn.innerText = 'Change Password';
      }
    } catch (error) {
      messageDiv.innerHTML = 'Connection error. Please try again.';
      messageDiv.style.color = 'var(--danger-color)';
      btn.disabled = false;
      btn.innerText = 'Change Password';
    }
  });
</script>
{% endblock %}
